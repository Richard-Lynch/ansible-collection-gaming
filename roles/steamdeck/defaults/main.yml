---
# AUTO-GENERATED defaults file — DO NOT EDIT.
#
# Source of truth: roles/steamdeck/meta/argument_specs.py
# Regenerate:      venv/bin/python tools/argspec/cli.py x generate steamdeck
#
# Edits here are silently overwritten on the next generation. To change a value or its
# documentation, change the OptionSpec in the source file above — descriptions there
# are emitted as the comments in this file.
# Entrypoint:      main

# Which entrypoint to run. Defaults to the read-only probe, so a bare
# run against an unfamiliar device changes nothing.
steamdeck_action__default: probe

# Actually make changes. Default false reports the planned work and
# stops.
steamdeck_apply__default: false

# Optional path on the CONTROLLER to write the probe's JSON to, for
# diffing against a later run. Empty means report only.
steamdeck_probe_output__default: ''

# Exact AppName of a non-Steam shortcut to remove completely.
# Reports the blast radius and stops unless the name is also given as
# steamdeck_remove_confirm.
steamdeck_remove_app__default: ''

# Must equal steamdeck_remove_app for the deletion to proceed.
# A boolean flag is too easy to carry over from a previous command;
# typing the name back is a deliberate act. This deletes a Proton prefix
# — tens of GB of local settings and mods that nothing backs up.
steamdeck_remove_confirm__default: ''

# Also delete the Proton prefix and leftover installers, not just the
# shortcut. False removes the library entry and leaves the data.
steamdeck_remove_data__default: true

# Where role helper scripts are staged on the target. Empty means
# ~/.local/share/richard_lynch.gaming/steamdeck under the target user's
# HOME: a stable per-user directory, so an unchanged helper is not
# rewritten after every reboot.
steamdeck_helper_dir__default: ''

# Steam per-account config directory, e.g. ~/.steam/steam/userdata/NNN.
# Discovered automatically when empty; name it explicitly only if the
# device has more than one Steam account, where guessing would edit the
# wrong profile.
steamdeck_steam_userdir__default: ''

# Per-plugin settings FILENAME, as {plugin_dir: filename}, for each plugin
# named in steamdeck_decky_settings whose file is not settings.json.
# Plugins do not agree on a name or a format (settings.json, config.json,
# settings.ini, a plugin-named .json, a bare .txt), and assuming
# settings.json silently does nothing for those. JSON and INI are both
# handled; for INI use 'section.key' names.
steamdeck_decky_settings_files__default: {}

# Settings to enforce inside Decky plugins, as
# {plugin_dir: {key: value}}. Declare in inventory, not on the command
# line — these describe how the device should behave, not this run.
# Values are compared by TYPE as well as value: a bool written as the
# string 'false' is truthy to a plugin's frontend, which is a silent
# misconfiguration rather than an error.
steamdeck_decky_settings__default: {}

# Keys to enforce in ~/.config/EmuDeck/settings.json.
# MERGED into the file on the device, not templated over it — each
# emulator entry carries EmuDeck's own metadata (id/name/platforms)
# which differs between entries and changes between releases, so
# reproducing it here would pin the device to one EmuDeck version.
# Within installEmus/overwriteConfigEmus/installFrontends a bare bool
# is shorthand for {status: <bool>}.
# overwriteConfigEmus is the one that matters: true means a setup.sh
# rerun REPLACES that emulator's config, reverting any hand-tuning.
steamdeck_emudeck_settings__default: {}

# settings.json credential fields to resolve from 1Password, as
# {path: {item, field, vault}}. Path may be dotted for nested fields,
# e.g. 'achievements.user'. Resolved through the CACHED lookup.
# EMPTY BY DEFAULT, deliberately: with nothing declared the credentials
# already on the device are left alone. This play's value is in
# overwriteConfigEmus — rewriting a password that is already correct
# earns nothing and adds a way to get it wrong.
steamdeck_emudeck_secrets__default: {}

# CSS Loader themes to install and configure, as a list of
# {name, id, patches, enabled}. `id` is the DeckThemes uuid — the
# themeId in https://deckthemes.com/themes/view?themeId=...
# `patches` selects a theme's own options by their EXACT declared names
# and values; both are validated against the theme's theme.json, because
# CSS Loader silently substitutes the default for anything it does not
# recognise rather than reporting an error.
# `enabled: false` keeps a theme installed and configured but inactive.
# Declare in inventory — which themes a device wears is device
# configuration, not a property of one run.
steamdeck_css_themes__default: []

# CSS Loader theme FOLDER names to uninstall from ~/homebrew/themes.
# REQUIRED to uninstall: nothing reconciles the themes directory against
# inventory, so removing a theme's steamdeck_css_themes entry leaves it
# installed and STILL ACTIVE — undeclared, unreported, and still styling
# the UI.
# Sequence: `enabled: false` -> apply -> confirm the device wrote
# {"active": false} -> name the folder here -> apply -> then drop the
# steamdeck_css_themes lines.
# A name appearing in BOTH lists is a hard error, not a precedence rule.
steamdeck_css_remove__default: []

# Decky plugin directory names to remove completely.
# Removal covers the plugin dir, ~/.config/<name>, per-plugin settings
# and the references Decky keeps in plugin_loader_settings.json —
# deleting only the directory leaves the last of those orphaned.
# NOTE any sysfs values the plugin applied (TDP, clocks) persist until a
# reboot; removal only stops them being reapplied.
steamdeck_decky_remove__default: []

# Cap the battery charge at this percentage; 100 disables the cap.
# 80 is the usual compromise — lithium cells degrade fastest held near
# full, and a mostly-docked device sits there constantly. Raise it to
# 100 before travelling.
steamdeck_battery_limit__default: 80

# Unit that re-applies the charge cap at boot; the sysfs node resets to
# 0 on every boot.
steamdeck_battery_unit__default: iaac-battery-limit.service

# close_game: seconds to wait after SIGTERM before SIGKILLing the game's
# process tree.
steamdeck_close_game_timeout__default: 30

# Confirms the wol_verify entrypoint may REBOOT the device.
# Separate from steamdeck_apply so a reboot cannot happen as a side
# effect of a broader run.
steamdeck_reboot_confirm__default: false

# Seconds to wait for the device to return after a reboot.
steamdeck_reboot_timeout__default: 300

# udev rule that enables wakeup as each device appears.
# The PRIMARY mechanism: power/wakeup resets on every device add, so a
# dock replug re-disables the chain and a boot-time service cannot see
# it. /etc is an overlayfs backed by the var partition, which SteamOS
# syncs across atomic updates.
steamdeck_wol_udev_rule__default: 99-iaac-wol-wakeup.rules

# Name of the boot-time unit that re-enables USB/PCI wakeup flags.
# Installed to /etc/systemd/system because Valve's atomic-update keep
# list preserves *.service there across OS updates — a udev rule, the
# otherwise obvious mechanism, is NOT preserved and would vanish.
steamdeck_wol_unit__default: iaac-usb-wakeup.service

# Inventory NAME of the host to wake, used in the script's log lines and
# messages. Empty means the wake_host entrypoint refuses to run.
steamdeck_wake_target__default: ''

# The target's WIRED NIC MAC. Wake-on-WiFi is rarely available, and the
# value must be recorded in inventory because every live source (DHCP
# leases, ARP, a network controller's client list) is empty exactly when
# the host is off and the value is needed.
steamdeck_wake_mac__default: ''

# Broadcast address of the TARGET's own VLAN (e.g. 192.0.2.255). A magic
# packet is a layer-2 broadcast and does not cross subnets, so sending to
# 255.255.255.255 from elsewhere reaches nothing — and because the packet
# is unacknowledged UDP, that failure is completely silent.
steamdeck_wake_broadcast__default: ''

# UDP port for the magic packet. 9 (discard) is conventional; 7 also
# works. Unprivileged either way, which is what lets a Game Mode tile
# send it without a sudo password.
steamdeck_wake_port__default: 9

# Address to probe to decide whether the wake WORKED. Sending proves
# nothing — the packet is unacknowledged — so this is the only honest
# signal. Prefer an IP or a name that resolves to the WIRED address: a
# name that falls back to WiFi can never come up from a magic packet, and
# a successful wake would be reported as a failure.
steamdeck_wake_probe_host__default: ''

# Port to probe on the target. 22 answers early in boot, so it reports a
# wake sooner than a game-streaming port would.
steamdeck_wake_probe_port__default: 22

# Base URL of the streaming host's Steam guard, e.g.
# http://<host name>:8090. The restart tile POSTs <url>/steam/restart and
# polls <url>/healthz. Use a DNS NAME, and declare it in inventory.
steamdeck_steam_guard_url__default: ''

# Inventory name of the host whose Steam the tile restarts (for messages).
steamdeck_steam_guard_target__default: ''

# Seconds the tile waits for a fresh Steam with Remote Play listening
# before reporting the restart did not come back.
steamdeck_steam_guard_timeout__default: 150

# Base URL of a Don't Starve Together server's control endpoint, e.g.
# http://<host name>:8091 (the service_dst_server role). iaac-dst.sh
# POSTs <url>/start or /stop and polls <url>/healthz. Use a DNS NAME, and
# declare it in inventory.
steamdeck_dst_control_url__default: ''

# Inventory name of the host running the DST server (for messages).
steamdeck_dst_control_target__default: ''

# Seconds the Start tile waits for every shard to be listening. A start
# after a game patch downloads the update first, hence the long default.
steamdeck_dst_start_timeout__default: 900

# dst_play: the DST server's NAME, resolved on the Deck at press time
# (+connect needs an address, and which one answers depends on the network).
steamdeck_dst_play_host__default: ''

# dst_play: the server's MASTER shard port (DST's default 10999).
steamdeck_dst_play_port__default: 10999

# dst_play: the 1Password item holding the server's join password.
steamdeck_dst_play_password_item__default: ''

# dst_play: the field of that item.
steamdeck_dst_play_password_field__default: password

# dst_play: the 1Password vault of that item. Required when
# steamdeck_dst_play_password_item is set.
steamdeck_dst_play_secret_vault__default: ''

# dst_play: seconds to wait, after launching, for the SERVER to count a
# player (/healthz players >= 1): Proton start, the connect, and the
# server's mods downloading on a first join.
steamdeck_dst_play_join_timeout__default: 300

# dst_play: after DST exits, the server must read 0 players twice this many
# seconds apart before the tile stops it (a quick rejoin keeps it up).
steamdeck_dst_play_stop_grace__default: 60

# Seconds to wait for the target to answer before reporting it did not
# wake. A cold boot from S5 is slower than a resume from suspend.
steamdeck_wake_timeout__default: 120

# URL the script GETs when this Deck is NOT on the target's segment —
# i.e. undocked, on WiFi. A layer-2 broadcast cannot cross a VLAN, so a
# direct send from another subnet SUCCEEDS and reaches nothing; this asks
# a host that DOES have a leg there to send it instead.
# A relay with a leg on every VLAN and its own allowlist of what may be
# woken suits this well: the Deck then needs no SSH key, no credential
# and nothing to rotate.
# Use a DNS NAME on the VLAN the Deck reaches it from, not an address.
# Empty means no fallback: the script then reports honestly that it
# cannot reach the target rather than sending into nowhere.
steamdeck_wake_endpoint__default: ''

# 1Password item holding this device's sudo password.
# The inventory names the ITEM; the role resolves it through the cached
# lookup, so the secret appears in neither the inventory nor a command
# line. Empty means no privileged tasks can run — SteamOS requires a
# password for sudo.
steamdeck_sudo_secret_item__default: ''

# Vault the sudo password lives in. Required when
# steamdeck_sudo_secret_item is set.
steamdeck_sudo_secret_vault__default: ''

# backup pulls the device's grid artwork into steamdeck_artwork_dir's
# _device/ directory; restore pushes the tree's art back, keyed to each
# shortcut's CURRENT appid.
# Restore never overwrites a file already on the device.
# prune deletes ORPHANED non-Steam art: files named for a shortcut-range
# appid (>= 2**31) that no shortcut in shortcuts.vdf has any more. Steam
# game art and unrecognised names are never touched. Preview unless
# steamdeck_apply; art not byte-identical to a vendored file is fetched
# to steamdeck_artwork_backup_dir first.
steamdeck_artwork_action__default: restore

# CONTROLLER directory holding the tile artwork, one subdirectory per
# shortcut named slug(NAME), plus a MANIFEST.json recording which
# shortcut each set belongs to. Required by the artwork entrypoint
# (every action: restore stages it, prune hashes it, backup writes
# under its _device/). The artwork is the caller's data, not the
# role's: tile art is usually third-party, so it is kept wherever the
# caller keeps its own files and named here.
steamdeck_artwork_dir__default: ''

# CONTROLLER directory that prune backs unvendored orphans up into,
# under <inventory_hostname>/<timestamp>/. Empty derives
# $HOME/.cache/iaac/steamdeck-grid-backup from the controller's
# environment. Deliberately outside steamdeck_artwork_dir: if that
# tree is version-controlled, art parked inside it is one careless
# staging command from being committed.
steamdeck_artwork_backup_dir__default: ''

# Non-Steam shortcuts to manage explicitly, as
# {name, exe, start_dir, launch_options, icon, flatpak_app_id, adopt}.
# `adopt: true` claims an EXISTING entry of that name rather than
# creating a second one — keeping its appid, which Steam uses to key
# artwork, controller layout and play time.
# Entries generated by another tool (EmuDeck's Steam ROM Manager) must
# NOT be declared here: SRM rewrites them whenever it runs, so both
# would fight and SRM would win.
steamdeck_managed_shortcuts__default: []

# Who owns the non-Steam shortcuts this role does NOT manage, as
# {owner, exe_search}: an entry whose Exe matches the `exe_search` regex
# (Python re.search) is reported as `no — owned by <owner>`; the first
# match wins. An untagged entry matching none is reported as
# `no — origin unknown (not tagged by iaac)` — never as hand-made, which
# the role cannot know. REPORTING ONLY: this changes no write; only the
# 'iaac' tag decides what the role manages.
# The default recognises EmuDeck's Steam ROM Manager by its launcher
# directory, which is the one field SRM writes that is EmuDeck's own
# convention (its tags are the parser's category name, e.g. 'Emulation' or
# 'Nintendo Game Boy Advance', which a user can rename).
steamdeck_shortcut_owners__default:
  - owner: Steam ROM Manager (EmuDeck)
    exe_search: /Emulation/tools/launchers/[^/]+[.]sh

# Inventory name of the Sunshine host to build stream shortcuts for.
# EMPTY (the default) generates NO stream tiles, and the shortcuts merge
# then removes any it generated before — removal is by omission.
# SET THIS IN INVENTORY, not on the command line — it describes the
# network, and a value living only in shell history is not configuration.
# The tiles come from steamdeck_stream_apps.
steamdeck_stream_host__default: ''

# The streaming host's Sunshine apps, as a list of {name, ...}: one
# stream tile per entry, named steamdeck_stream_prefix + name. Only
# `name` is read. Point it at the list the host's own configuration
# already declares rather than redeclaring it — two lists drift the
# first time an app is added on one side only.
steamdeck_stream_apps__default: []

# Prefix for generated shortcut names, so streamed tiles are
# distinguishable from locally-installed games in the library.
steamdeck_stream_prefix__default: 'Stream: '

# Seconds to wait after stopping Steam before writing shortcuts.vdf.
# Steam flushes this file as it shuts down; writing too early loses the
# edit to Steam's own final write.
steamdeck_steam_stop_wait__default: 8

# Inventory hostname of a paired Moonlight host to pin by NAME,
# written to Moonlight's `manualaddress` and tried alongside discovery.
# USUALLY UNNECESSARY, and empty by default: a DHCP reservation is the
# better fix for a wandering host, because it keeps every client correct
# rather than just this one. Use this only where a reservation cannot
# help — a NIC swap or a VLAN move, which change the key a reservation
# is written against.
steamdeck_moonlight_host__default: ''

# Streaming frame rate. 0 leaves it untouched.
# The OLED Deck (Galileo) has a 90Hz panel and Moonlight defaults to 60,
# which quietly discards a third of the refresh rate.
steamdeck_moonlight_fps__default: 0

# Streaming bitrate in Kbps. 0 leaves it untouched.
# 30000 is Moonlight's default for this resolution and is aggressive for
# WiFi; the symptom of over-shooting is stutter that looks like a host
# problem.
steamdeck_moonlight_bitrate__default: 0

# Enable HDR. Empty leaves it untouched.
# The OLED panel supports it. SET BOTH ENDS OR NEITHER: the host must
# advertise a 10-bit profile (Sunshine's hevc_mode 3 rather than 2) AND
# have its compositor in HDR mode. A client asking for HDR against an
# 8-bit-only host negotiates down silently, which is hard to attribute
# later.
# NOTE this is Moonlight's GLOBAL default. Each paired app also carries its
# own hdr key, and a per-app false overrides this — so flipping the global
# alone can appear to do nothing.
steamdeck_moonlight_hdr__default: ''
